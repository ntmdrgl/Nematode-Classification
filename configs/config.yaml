defaults:
  - _self_
  - model: fcn
  - dataset: openworm_eigenworms
  - override hydra/job_logging: disabled # prevents .log generation

model_params: {}

epochs: 200
batch_size: 32
patience: 10

learning_rate: 0.001
weight_decay: 0.01

class_weighted_loss: false

seed: 42

hydra:
  run:
    # dir: runs/${now:%Y-%m-%d_%H-%M-%S} # use if you want to save runs
    dir: .                             # use if you don't want to save runs
